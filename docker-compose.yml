version: '3.8'

services:
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      - MONGO_USER=root
      - MONGO_PASSWORD=example
      - MONGO_HOST=faceverification.qp2ckht.mongodb.net
      - DOCKER_ENV=true
    volumes:
      - .:/app
    devices:
      - "/dev/video0:/dev/video0"
    privileged: true
    environment:
      - MONGO_USER=root
      - MONGO_PASSWORD=example
      - MONGO_HOST=faceverification.qp2ckht.mongodb.net
      - DOCKER_ENV=true
      - WINDOWS_HOST=true
      - OPENCV_VIDEOIO_PRIORITY_DSHOW=1
